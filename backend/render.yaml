databases:
  - name: neurowealth-db
    plan: free

services:
  - type: web
    name: neurowealth-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: VAULT_CONTRACT_ID
        value: CC2A56NEH35Z2VJ5TALSULYUICPCJXU3KLBHOTMU3OSRSOCCDJN5A42O
      - key: USDC_TOKEN_ADDRESS
        value: CAQCFVLOBK5GIULPNZRGATJJMIZL5BSP7X5YJVMGCPTUEPFM4AVSRCJU
      - key: CORS_ORIGINS
        value: https://neurowealth-frontend.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: neurowealth-db
          property: connectionString
      - key: STELLAR_AGENT_SECRET_KEY
        sync: false
      - key: WALLET_ENCRYPTION_KEY
        sync: false
      - key: JWT_SEED
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: WHATSAPP_FROM
        sync: false
      - key: BLEND_POOL_ID
        sync: false
